name: CI

# Dependabot の PR を自動で取り込む前の関門 (dependabot-security-merge.yml が
# この結果を待つ)。人が出す PR でも同じ確認が走る。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mirador-app/package-lock.json
      - run: npm ci
        working-directory: mirador-app
      - run: npm run build
        working-directory: mirador-app
