version: 2
updates:
  - package-ecosystem: "npm"
    # package.json はルートには無く、この 2 か所にある
    directories:
      - "/mirador-app"
      - "/iiifserver"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # サプライチェーン攻撃対策: 公開直後のバージョンは取らない。
    # security update は cooldown を無視するので即時に PR が来る。
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
